# ==========================================
# HYPRLAND KEYBINDINGS
# ==========================================

$terminal = ghostty
$mainMod = SUPER

# --- APPLICATIONS ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, W, exec, brave
bind = $mainMod, E, exec, thunar
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, Escape, exit
bind = CTRL, Space, exec, ~/.config/hypr/scripts/wall-selector.sh
bind = $mainMod, Space, exec, wofi --show drun

# --- WINDOW MANAGEMENT ---
bind = $mainMod, Q, killactive, 
bind = $mainMod, F, fullscreen
bind = $mainMod, T, togglefloating

# --- FOCUS (ALT + Arrows) ---
bind = ALT, left, movefocus, l
bind = ALT, right, movefocus, r
bind = ALT, up, movefocus, u
bind = ALT, down, movefocus, d

# --- SWAP WINDOWS (ALT + SHIFT + Arrows) ---
bind = ALT SHIFT, left, swapwindow, l
bind = ALT SHIFT, right, swapwindow, r
bind = ALT SHIFT, up, swapwindow, u
bind = ALT SHIFT, down, swapwindow, d

# --- RESIZE WINDOWS (CTRL + SHIFT + Arrows) ---
binde = CTRL SHIFT, left, resizeactive, -30 0
binde = CTRL SHIFT, right, resizeactive, 30 0
binde = CTRL SHIFT, up, resizeactive, 0 -30
binde = CTRL SHIFT, down, resizeactive, 0 30

# --- WORKSPACES ---
# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

# Scroll through workspaces
bind = CTRL ALT, left, workspace, -1
bind = CTRL ALT, right, workspace, +1
bind = $mainMod, left, workspace, -1
bind = $mainMod, right, workspace, +1
