# ==========================================
# HYPRLAND KEYBINDINGS
# ==========================================

$terminal = ghostty
$mainMod = SUPER

# --- APPLICATIONS ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, W, exec, brave
bind = $mainMod, E, exec, thunar
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, Escape, exit
bind = CTRL, Space, exec, ~/.config/hypr/scripts/wall-selector.sh
bind = CTRL SHIFT, Space, exec, wofi --show drun --no-actions
bind = $mainMod, Space, exec, wofi --show drun --no-actions
bind = $mainMod, P, exec, wofi --show run

# --- WINDOW MANAGEMENT ---
bind = $mainMod, Q, killactive, 
bind = $mainMod, F, fullscreen
bind = $mainMod, T, togglefloating

bind = ALT, Shift_L, exec, hyprctl switchxkblayout current next

# --- FOCUS (ALT + Arrows) ---
bind = ALT, left, movefocus, l
bind = ALT, right, movefocus, r
bind = ALT, up, movefocus, u
bind = ALT, down, movefocus, d

# --- RESIZE WINDOWS (CTRL + SHIFT + Arrows) ---
binde = CTRL SHIFT, left, resizeactive, -30 0
binde = CTRL SHIFT, right, resizeactive, 30 0
binde = CTRL SHIFT, up, resizeactive, 0 -30
binde = CTRL SHIFT, down, resizeactive, 0 30

# --- WORKSPACES ---
# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

# Scroll through workspaces
bind = $mainMod, left, workspace, -1
bind = $mainMod, right, workspace, +1

# --- SWAP WINDOWS (ALT + SHIFT + Arrows) ---
bind = CTRL ALT, left, movewindow, l
bind = CTRL ALT, right, movewindow, r
bind = CTRL ALT, up, movewindow, u
bind = CTRL ALT, down, movewindow, d

# --- PRESELECT (Visual notifications) ---
bind = $mainMod SHIFT, right, exec, hyprctl dispatch layoutmsg preselect r && notify-send -t 1200 -h string:x-canonical-private-synchronous:preselect "◨  Next window right"
bind = $mainMod SHIFT, left,  exec, hyprctl dispatch layoutmsg preselect l && notify-send -t 1200 -h string:x-canonical-private-synchronous:preselect "◧  Next window left"
bind = $mainMod SHIFT, up,    exec, hyprctl dispatch layoutmsg preselect u && notify-send -t 1200 -h string:x-canonical-private-synchronous:preselect "⬒  Next window up"
bind = $mainMod SHIFT, down,  exec, hyprctl dispatch layoutmsg preselect d && notify-send -t 1200 -h string:x-canonical-private-synchronous:preselect "⬓  Next window down"

# Cancel preselect (closes the notification instantly)
bind = $mainMod SHIFT, Space, exec, hyprctl dispatch layoutmsg preselect cancel && makoctl dismiss

#bind = $mainMod SHIFT, right, layoutmsg, preselect r
#bind = $mainMod SHIFT, left, layoutmsg, preselect l
#bind = $mainMod SHIFT, up, layoutmsg, preselect u
#bind = $mainMod SHIFT, down, layoutmsg, preselect d
#bind = $mainMod SHIFT, Space, layoutmsg, preselect cancel

# --- MULTIMEDIA KEYS ---
# Volume
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/system/volume.sh up
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/system/volume.sh down
bindl  = , XF86AudioMute, exec, ~/.config/hypr/scripts/system/volume.sh mute

bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/system/brightness.sh up
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/system/brightness.sh down

# --- SYSTEM MENUS ---
# Wifi
bind = SUPER, N, exec, ~/.config/hypr/scripts/system/wifi.sh
