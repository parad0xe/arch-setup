# -- tmux cheat sheet -- #

# https://tmuxcheatsheet.com/

##################################################
# CORE CHANGES                                   #
##################################################

# change prefix
unbind C-b
set -g prefix C-s

# reload conifg
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# start with zsh
set-option -g default-shell /usr/bin/zsh
set-option -g default-command "/usr/bin/zsh"   

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Increase scrollback history (default 2000 is too low)
set -g history-limit 50000

# Base pane index is now 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Remove escape delay for instant Vim mode switches
set -s escape-time 0

# Enable focus events for modern editors/tools
set -g focus-events on

set -g mouse on

##################################################
# ACT LIKE VIM                                   #
##################################################

# set vim mode
setw -g mode-keys vi

# use v and vim keybind for the copy mode
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

##################################################
# NAVIGATION & SPLITS                            #
##################################################

# new pan in current pan dir
bind-key  c  new-window      -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Move between panes with vim keys (after prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim keys (after prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Extraire le panneau actuel vers sa propre fenêtre
bind b break-pane

# Fusionner le dernier panneau utilisé à côté (split horizontal)
bind y join-pane -s ! -h

# Fusionner le dernier panneau utilisé en dessous (split vertical)
bind Y join-pane -s ! -v

##################################################
# POPUP                                          #
##################################################

# Make popups inherit the terminal background instead of tmux's solid one
set -g popup-style "bg=default"
set -g popup-border-style "bg=default"

# open a popup in the notes
unbind p
bind-key p display-popup -w 80% -h 80% -E $SHELL

# open a popup in the notes
unbind n
bind-key n display-popup -w 70% -h 70% -E "nvim ~/Documents/notes/todo.md"

# open tmux conf
unbind C
bind-key C display-popup -w 80% -h 80% -E "nvim ~/.tmux.conf"

# open a popup in the notes
bind-key S display-popup -w 70% -h 80% -E "hyprmon"

# Interactive fuzzy session switcher with live pane preview (requires fzf)
unbind f
bind-key f display-popup -E -w 80% -h 60% \
  "tmux list-sessions -F '#{session_name}' | fzf --reverse --preview 'tmux capture-pane -pt {}' | xargs -r tmux switch-client -t"

# open a popup with the persistent "utils" vibe session (~/.bin/vibe-utils)
unbind A
bind-key A display-popup -w 90% -h 90% -E "vibe-utils"

##################################################
# APPERANCE                                      #
##################################################

# TrueColor / 24-bit color support
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"

# Enable image rendering passthrough (Kitty graphics protocol / Sixel)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Status bar
set -g status-style "bg=default,fg=#cfc9d8"

# Current window tab
set -g window-status-current-style "bg=default,fg=#ffffff,bold"

# Inactive windows
set -g window-status-style "bg=default,fg=#b8a9c9"

# Make popups inherit the terminal background instead of tmux's solid one
set -g popup-style "bg=default"
set -g popup-border-style "bg=default"
