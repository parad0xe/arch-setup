[module]
name = "Terminal"
about = "Shell and terminal tools"

[[unit]]
id = "shell"
name = "Shell: Starship, eza, bat, zoxide, fzf, and Zsh or fish"
about = """
The prompt and the tools the shell configs run, with the Starship config.
The shell itself is a choice between the zsh and fish parts: one of them
comes with this unit, Zsh unless fish is picked. Its config is copied: it is
edited on each machine, and these edits stay out of the repository.
"""
requires = ["vim"]
choice = { parts = ["zsh", "fish"], default = "zsh" }
packages = ["starship", "eza", "bat", "zoxide", "fzf"]
files = [{ source = "files/starship/nerd-font-symbols.toml", target = ".config/starship.toml" }]

[[unit]]
id = "zsh"
parent = "shell"
name = "Zsh and Oh My Zsh"
about = """
Zsh as the login shell, Oh My Zsh with the autosuggestions and syntax
highlighting plugins, and the zshrc, which sets Vim as the editor (git
commit, sudoedit).
"""
requires = ["shell"]
packages = ["zsh", "zsh-autosuggestions", "zsh-syntax-highlighting"]
files = [{ source = "files/zshrc/{zshrc}.zsh", target = ".zshrc" }]
variants = [{ id = "zshrc", name = "Zsh config", options = ["default", "kayzzel", "parad0xe"] }]
hooks = ["setup_zsh"]

[[unit]]
id = "fish"
parent = "shell"
name = "fish"
about = "fish as the login shell, with a config that runs the same tools as the zshrc."
requires = ["shell"]
packages = ["fish"]
files = [{ source = "files/fish", target = ".config/fish" }]
hooks = ["setup_fish"]

[[unit]]
id = "fastfetch"
parent = "shell"
name = "fastfetch system summary, with its theme"
about = "Shown when a shell opens; the zshrc skips it when it is not installed."
packages = ["fastfetch"]
files = [{ source = "files/fastfetch/{theme}", target = ".config/fastfetch" }]
variants = [{ id = "theme", name = "fastfetch theme", options = ["default", "dragon"], default = "dragon" }]

[[unit]]
id = "tmux"
name = "Tmux terminal multiplexer"
about = "tmux and its config, copied so that its edits stay out of the repository."
requires = ["shell"]
packages = ["tmux"]
files = [{ source = "files/tmux/default.conf", target = ".tmux.conf" }]

[[unit]]
id = "vim"
name = "Vim and vim-plug"
about = "Vim, vim-plug, and the vimrc, copied so that its edits stay out of the repository."
packages = ["vim"]
files = [{ source = "files/vimrc/{vimrc}.vim", target = ".vimrc" }]
variants = [{ id = "vimrc", name = "Vim config", options = ["default", "kayzzel", "parad0xe"] }]
hooks = ["install_vim_plug"]

[[unit]]
id = "yazi"
name = "yazi terminal file manager"
packages = ["yazi"]

[[unit]]
id = "bin"
name = "Personal scripts in ~/.local/bin"
about = "Copied with execute permissions; the folder keeps its other scripts."
files = [{ source = "files/bin/{scripts}", target = ".local/bin", contents = true, permissions = "755" }]
variants = [{ id = "scripts", name = "Personal scripts", options = ["default", "parad0xe"] }]
