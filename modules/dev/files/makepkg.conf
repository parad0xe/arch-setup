# User settings of makepkg, deployed by the python unit (modules/dev).
#
# The python unit sets a pyenv Python as the global version, which then comes
# first in PATH: AUR packages would be built with it, where their build tools
# (python-build, python-installer) are missing, and installed under its
# folder. They are built with the system Python, the one they depend on.
export PYENV_VERSION=system
