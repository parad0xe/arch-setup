# Bluetooth audio in A2DP only: headsets are not offered the Hands-Free (HFP)
# and Headset (HSP) profiles. A headset that reconnects by itself opens HFP
# first, and where HFP fails (e.g. Apple Silicon Macs), it opens no audio at
# all. The headset microphone is not available over Bluetooth.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
}
