directory: ~/Music
library: ~/.local/share/beets/library.db

import:
  write: yes
  move: yes
  log: ~/.local/share/beets/import.log

# No mpdupdate: it would warn on every import without a running MPD, and the
# music server refreshes itself (auto_update in mpd.conf) when it is picked.
plugins: replaygain fetchart duplicates

replaygain:
  backend: ffmpeg

fetchart:
  cautious: yes

paths:
  # One-off tracks (beet import -s, used by getmusic for singles and mixed
  # playlists) all land flat in one folder instead of spawning a one-song
  # artist folder at the root of the library.
  singleton: Singles/$artist - $title
