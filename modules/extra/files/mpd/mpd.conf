music_directory         "~/Music"
playlist_directory      "~/Music/Playlists"

db_file                 "~/.local/share/mpd/database"
state_file              "~/.local/share/mpd/state"
sticker_file            "~/.local/share/mpd/sticker.sql"

auto_update             "yes"
bind_to_address         "127.0.0.1"
restore_paused          "yes"
max_output_buffer_size  "16384"
replaygain              "auto"

audio_output {
    type "pipewire"
    name "PipeWire Output"
    # Disabled: at least on Asahi/Apple silicon with a Bluetooth output, the
    # native client's data-loop thread occasionally deadlocks and pipewire's
    # loop watchdog then SIGKILLs the whole process a few seconds into
    # playback (2026-11-09; it killed the pipewire server the same way). The
    # pulse output below routes the same stream through pipewire-pulse, whose
    # data loop lives in the stable server process. Point this back to
    # pipewire when a fixed version ships.
    enabled "no"
}

audio_output {
    type "pulse"
    name "PulseAudio Output"
}

audio_output {
    type "fifo"
    name "visualizer"
    path "/tmp/mpd.fifo"
    format "44100:16:2"
}

# No MIDI in the library, and without a timidity.cfg (package timidity++)
# every mpd start prints a loud warning about this decoder. Turn it off.
decoder {
    plugin "wildmidi"
    enabled "no"
}
