[Unit]
# The native pipewire data-loop can watchdog-kill mpd (see mpd.conf) and
# kernel OOM picked mpd over browser tabs when both were candidates: restart
# unconditionally on failure, and let there be no rate limit on it.
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=2
# Lower than the user-manager default (200) so a real kernel OOM prefers
# browser processes to mpd. The user manager clamps to its own floor, so
# the effective adjust is 100; it cannot go lower unprivileged.
OOMScoreAdjust=0
