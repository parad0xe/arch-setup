[workspace]
resolver = "3"
members = ["model", "repo", "host", "journal", "runner", "screens", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
crossterm = "0.28"
glob = "0.3"
nix = { version = "0.30", features = ["signal", "term", "user"] }
ratatui = "0.29"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
tempfile = "3"
thiserror = "2"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = true
codegen-units = 1
