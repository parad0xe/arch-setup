# ==========================================
# HYPRLAND CONFIGURATION - NVIDIA OPTIMIZED
# ==========================================

# --- MONITORS ---
# Auto-detect monitors and set them to their preferred resolution
monitor=,preferred,auto,1

# --- NVIDIA ENVIRONMENT VARIABLES ---
# Crucial for the RTX 4090 to work properly on Wayland
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# --- AUTOSTART ---
# Execute your essential components at startup
exec-once = killall waybar; waybar
exec-once = hyprpaper
exec-once = nm-applet --indicator
exec-once = blueman-applet

# --- KEYBOARD LAYOUT ---
input {
    kb_layout = us # Change to 'us' if you use a QWERTY keyboard
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    
    natural_scroll = true

    touchpad {
        natural_scroll = true
    }
}

# --- VISUALS ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# --- KEYBINDINGS ---
$mainMod = SUPER

bind = $mainMod, Return, exec, kitty
bind = $mainMod, W, exec, brave
bind = $mainMod, E, exec, thunar
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, Escape, exit

bind = $mainMod, Q, killactive, 
bind = $mainMod, Space, exec, wofi --show drun
bind = $mainMod, F, togglefloating, 

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
