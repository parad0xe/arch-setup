# ==========================================
# HYPRLAND CONFIGURATION - NVIDIA OPTIMIZED
# ==========================================

# --- MONITORS ---
# Auto-detect monitors and set them to their preferred resolution
monitor=,preferred,auto,1

# --- NVIDIA ENVIRONMENT VARIABLES ---
# Crucial for the RTX 4090 to work properly on Wayland
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# --- AUTOSTART ---
# Execute your essential components at startup
exec-once = killall waybar; waybar
exec-once = hyprpaper
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = ~/Projects/arch-setup/dotfiles/hypr/scripts/clipboard.sh
exec-once = ~/Projects/arch-setup/dotfiles/hypr/change-wall.sh

# --- KEYBOARD LAYOUT ---
input {
    kb_layout = us # Change to 'us' if you use a QWERTY keyboard
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    
    natural_scroll = true

    touchpad {
        natural_scroll = true
    }
}

# --- VISUALS ---
general {
    gaps_in = 3
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(89b4faff)
    col.inactive_border = rgba(1e1e2eaa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# --- KEYBINDINGS ---
$terminal = ghostty
$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, W, exec, brave
bind = $mainMod, E, exec, thunar
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, Escape, exit
bind = CTRL, Space, exec, ~/Projects/arch-setup/dotfiles/hypr/rofi-wall.sh

bind = $mainMod, Q, killactive, 
bind = $mainMod, Space, exec, wofi --show drun
bind = $mainMod, F, fullscreen
bind = $mainMod, T, togglefloating

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

bind = CTRL ALT, left, workspace, -1
bind = CTRL ALT, right, workspace, +1
bind = $mainMod, left, workspace, -1
bind = $mainMod, right, workspace, +1

bind = ALT, left, movefocus, l
bind = ALT, right, movefocus, r
bind = ALT, up, movefocus, u
bind = ALT, down, movefocus, d

bind = ALT SHIFT, left, swapwindow, l
bind = ALT SHIFT, right, swapwindow, r
bind = ALT SHIFT, up, swapwindow, u
bind = ALT SHIFT, down, swapwindow, d
